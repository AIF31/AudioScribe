[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-transcription"
version = "0.1.0"
description = "Audio transcription CLI using local faster-whisper or OpenAI cloud models."
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper>=1.2.1,<2.0.0",
    "ctranslate2>=4.7.1,<5",
    "av>=12.0.0",
    "python-dotenv>=1.0.1",
    "openai>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "tenacity>=9.0.0",
    "websocket-client>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
cuda = [
    "nvidia-cublas-cu12; platform_system == 'Linux'",
    "nvidia-cudnn-cu12==9.*; platform_system == 'Linux'",
]
diarize = [
    "torch==2.4.1",
    "torchaudio==2.4.1",
    "pyannote.audio==3.3.1",
    "huggingface-hub==0.27.1",
]
rocm = []

[project.scripts]
audio-transcribe = "audio_transcriber.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
